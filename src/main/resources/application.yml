server:
  port: 8080

logging:
  level:
    root: INFO
    com.handan: DEBUG

# 业务文件工作目录配置（可根据实际情况修改）
handan:
  workspace:
    # 存放待处理单据与母表 Excel 的默认文件夹目录
    # 默认为项目根目录下的 data 目录（如果不存在会自动创建）
    data-dir: "/Users/dean/Documents/handan_prod/"
    # mapping-config.yaml 配置文件路径
    config-path: "./mapping-config.yaml"

  # Excel 文件扫描与过滤规则配置（由配置文件动态控制）
  excel:
    filter:
      # 排除的文件名前缀（如 Office/WPS 锁文件 ~$、系统隐藏文件 .）
      exclude-prefixes:
        - "~$"
        - "."
      # 排除的文件名包含特征（如临时写回文件 _temp_、历史备份 _bak）
      exclude-contains:
        - "_temp_"
        - "_bak"
      # 排除的后缀扩展名（如 .tmp）
      exclude-suffixes:
        - ".tmp"
      # 排除的正则表达式（如精确到秒的14位数字时间戳备份文件 *_yyyyMMddHHmmss.xlsx/xls）
      exclude-regex-patterns:
        - ".*_\\d{14}\\.(xlsx|xls)$"
